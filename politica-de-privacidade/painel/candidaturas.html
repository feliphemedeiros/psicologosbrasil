<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/icones/favicon.svg" type="image/svg+xml">
  <title>Candidaturas · Painel Psicólogos Brasil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/agenda.css">
  <link rel="stylesheet" href="css/escuro.css">
  <link rel="stylesheet" href="css/campos.css">
  <script src="js/campos.js" defer></script>
  <script src="js/tema.js"></script>
  <style>
    .secao-topo a { color: var(--sea); font-weight: 600; }
    .cd-qtd { margin-left: 10px; font-size: 15px; font-weight: 600; color: var(--muted); vertical-align: middle; }
    .cd-filtros { display: grid; gap: 14px; }
    .cd-busca { position: relative; display: block; }
    .cd-busca svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
    .cd-busca input { width: 100%; padding-left: 40px; }
    .cd-status { display: flex; flex-wrap: wrap; gap: 8px; }
    .cd-status button { border: 1px solid var(--borda); background: var(--card); color: var(--texto); border-radius: 999px; padding: 6px 14px; font: 600 13px var(--fonte); cursor: pointer; }
    .cd-status button[aria-selected="true"] { background: var(--sea); border-color: var(--sea); color: #fff; }
    .cd-status b { font-weight: 700; opacity: .7; margin-left: 4px; }
    .cd-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .cd-vazio { grid-column: 1 / -1; text-align: center; color: var(--muted); background: var(--card); border-radius: 16px; padding: 40px 20px; margin: 0; }
    .cd-card { background: var(--card); border: 1px solid var(--borda); border-radius: 16px; box-shadow: var(--sombra); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .cd-card.nova { border-color: color-mix(in srgb, var(--sea) 45%, var(--borda)); }
    .cd-topo { display: flex; gap: 12px; align-items: flex-start; }
    .cd-ava { width: 42px; height: 42px; border-radius: 12px; background: var(--sea-claro); color: var(--sea); display: grid; place-items: center; font-weight: 800; flex: none; }
    .cd-nome { min-width: 0; flex: 1; }
    .cd-nome b { display: block; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
    .cd-nome small { color: var(--muted); font-size: 13px; }
    .cd-pill { flex: none; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .cd-pill.nova { background: var(--info-bg); color: var(--info); }
    .cd-pill.analise { background: var(--pend-bg); color: var(--pend); }
    .cd-pill.aprovada { background: var(--ok-bg); color: var(--ok); }
    .cd-pill.recusada { background: var(--neutro-bg); color: var(--neutro); }
    .cd-dados { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13.5px; }
    .cd-dados dt { color: var(--muted); }
    .cd-dados dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .cd-dados dd.alerta { color: var(--pend); font-weight: 600; }
    .cd-temas { display: flex; flex-wrap: wrap; gap: 5px; }
    .cd-temas span { background: var(--sea-claro); color: var(--sea); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
    .cd-msg { margin: 0; font-size: 13.5px; color: var(--texto); background: var(--bg); border-radius: 10px; padding: 10px 12px; white-space: pre-line; overflow-wrap: anywhere; max-height: 130px; overflow: auto; }
    .cd-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: auto; padding-top: 4px; border-top: 1px solid var(--borda); padding-top: 12px; }
    .cd-acoes select { min-height: 34px; padding: 4px 10px; font-size: 13px; border-radius: 10px; flex: 1 1 140px; }
    .cd-acoes .btn-perigo { margin-left: auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 520px) { .cd-grade { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="index.html">
        <span class="marca-ico">PB</span>
        <span>Psicólogos Brasil <small>Candidaturas</small></span>
      </a>
      <nav class="areas-nav" data-areas aria-label="Áreas do painel"></nav>
      <div class="topo-user">
        <a class="conta-btn" id="btn-conta" href="conta.html" title="Minha conta"><span class="conta-ava" aria-hidden="true"></span><span class="conta-txt"><span data-nome></span><small>Minha conta</small></span><span class="papel" data-papel hidden></span></a>
        <script>/* preenche o botão da conta já na hora (sem piscar) */(function(){try{var s=JSON.parse(sessionStorage.getItem('pb_painel_sessao'));if(!s)return;var a=document.getElementById('btn-conta'),n=s.nome||'';var i=n.split(/\s+/).filter(function(w){return w.length>2}).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()||(n.charAt(0)||'•').toUpperCase();a.querySelector('.conta-ava').textContent=i;a.querySelector('[data-nome]').textContent=n;a.setAttribute('aria-label','Minha conta: '+n);if(s.papel==='psicologo')a.href='minha-agenda.html#conta';if(/\/conta\.html$/.test(location.pathname))a.classList.add('atual');}catch(e){}})();</script>
        <button class="btn btn-secundario btn-peq" data-sair>Sair</button>
      </div>
    </div>
  </header>

  <main class="conteudo">
    <div class="secao-topo"><div><h1>Candidaturas<span class="cd-qtd" id="cd-qtd"></span></h1><p>Psicólogos que se cadastraram pela página <a href="../para-psicologos/" target="_blank" rel="noopener">Para psicólogos</a> do site.</p></div></div>
    <div class="bloco cd-filtros">
      <label class="cd-busca"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span class="sr-only">Procurar</span><input type="search" id="cd-q" placeholder="Procurar por nome, CRP, e-mail ou tema" autocomplete="off"></label>
      <div class="cd-status" id="cd-status" role="tablist" aria-label="Situação"></div>
    </div>
    <div class="cd-grade" id="cd-lista"><p class="cd-vazio">Carregando…</p></div>
    <nav class="paginacao" id="cd-pag" aria-label="Páginas de candidaturas"></nav>
  </main>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/nuvem.js"></script>
  <script src="../js/agenda/config.js"></script>
  <script src="../js/agenda/util.js"></script>
  <script src="../js/agenda/db.js"></script>
  <script src="../js/agenda/db-firebase.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/paginacao.js"></script>
  <script src="js/candidaturas.js"></script>
</body>
</html>
