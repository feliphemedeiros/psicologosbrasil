<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/icones/favicon.svg?v=109" type="image/svg+xml">
  <title>Pacientes | Painel Psicólogos Brasil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/agenda.css?v=290">
  <link rel="stylesheet" href="css/escuro.css?v=120">
  <link rel="stylesheet" href="css/topo.css?v=284">
<link rel="stylesheet" href="css/nav-equipe.css?v=291">
  <link rel="stylesheet" href="css/campos.css">
  <script src="js/campos.js" defer></script>
  <script src="js/tema.js?v=205"></script>
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="index.html">
        <span class="marca-ico marca-logo"><img src="../assets/imagens/logo.svg?v=109" alt="" width="34" height="34"></span>
        <span>Psicólogos Brasil <small>Pacientes</small></span>
      </a>
      <nav class="areas-nav" data-areas aria-label="Áreas do painel"></nav>
      <div class="topo-user">
        <a class="conta-btn" id="btn-conta" href="conta.html" title="Minha conta"><span class="conta-ava" aria-hidden="true"></span><span class="conta-txt"><span data-nome></span><small>Minha conta</small></span><span class="papel" data-papel hidden></span></a>
        <script>/* preenche o botão da conta já na hora (sem piscar) */(function(){try{var s=JSON.parse(sessionStorage.getItem('pb_painel_sessao'));if(!s)return;var a=document.getElementById('btn-conta'),n=s.nome||'';var i=n.split(/\s+/).filter(function(w){return w.length>2}).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()||(n.charAt(0)||'•').toUpperCase();a.querySelector('.conta-ava').textContent=i;a.querySelector('[data-nome]').textContent=n;a.setAttribute('aria-label','Minha conta: '+n);if(s.papel==='psicologo')a.href='minha-agenda.html#conta';if(/\/conta\.html$/.test(location.pathname))a.classList.add('atual');}catch(e){}})();</script>
        <button class="btn btn-secundario btn-peq" data-sair>Sair</button>
      </div>
    </div>
  </header>

  <main class="conteudo">
    <!-- LISTA -->
    <section id="pc-lista-tela">
      <div class="secao-topo">
        <div>
          <h1>Pacientes <span class="qtd-tit" id="pc-qtd"></span></h1>
          <p>Todos que já agendaram pelo site. Os dados vêm dos agendamentos: quem agenda de novo cai na mesma ficha (pelo WhatsApp ou e-mail).</p>
        </div>
      </div>
      <div class="pc-filtros">
        <input type="search" id="pc-q" placeholder="Procurar por nome, WhatsApp ou e-mail" aria-label="Procurar paciente" autocomplete="off">
        <select id="pc-psi" aria-label="Psicólogo"></select>
        <select id="pc-sit" aria-label="Situação">
          <option value="">Todos</option>
          <option value="ativo">Com sessão marcada</option>
          <option value="novo">Pacientes novos (últimos 30 dias)</option>
          <option value="plano">Em plano mensal</option>
          <option value="sem">Sem sessão marcada</option>
          <option value="30">Sem sessão há mais de 30 dias</option>
          <option value="60">Sem sessão há mais de 60 dias</option>
          <option value="vencida">Pré-reserva vencida (nunca fez sessão)</option>
        </select>
        <select id="pc-ordem" aria-label="Ordem">
          <option value="recentes">Atividade mais recente</option>
          <option value="nome">Nome (A–Z)</option>
          <option value="sessoes">Mais sessões</option>
          <option value="parados">Mais tempo sem sessão</option>
        </select>
        <div class="vista-tog" id="pc-vista" role="group" aria-label="Como mostrar os pacientes">
          <button type="button" data-vista="lista" aria-pressed="true" title="Ver em lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg><span class="sr">Lista</span></button>
          <button type="button" data-vista="grade" aria-pressed="false" title="Ver em quadros"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg><span class="sr">Quadros</span></button>
        </div>
      </div>
      <div class="bloco pc-bloco" id="pc-bloco"><div id="pc-lista"></div></div>
      <nav class="paginacao" id="pc-pag" aria-label="Páginas de pacientes"></nav>
    </section>

    <!-- FICHA -->
    <section id="pc-ficha-tela" hidden></section>
  </main>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/nuvem.js"></script>
  <script src="../js/agenda/config.js?v=267"></script>
  <script src="../js/agenda/util.js?v=163"></script>
  <script src="../js/agenda/db.js?v=286"></script>
  <script src="../js/agenda/db-firebase.js?v=286"></script>
  <script src="../js/agenda/servicos.js?v=274"></script>
  <script src="js/sessao.js?v=290"></script>
  <script src="js/notificacoes.js?v=288"></script>
  <script src="js/nav-equipe.js?v=291"></script>
  <script src="js/paginacao.js"></script>
  <script src="js/pacientes.js?v=281"></script>
</body>
</html>
